<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7fb">
  <title>My Work Checklist</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #20222a;
      --muted: #787d8c;
      --line: #e7e8ee;
      --surface: #ffffff;
      --background: #f7f7fb;
      --purple: #7468c9;
      --purple-soft: #f3f0ff;
      --green: #3f9279;
      --pink: #c66e88;
      --blue: #527fae;
      --gold: #a66f00;
      --gold-soft: #fff8df;
      --danger: #cb5f68;
      --shadow: 0 12px 35px rgba(36, 38, 50, .06);
    }

    body {
      margin: 0;
      min-width: 300px;
      color: var(--ink);
      background: var(--background);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(860px, calc(100% - 28px));
      margin: 0 auto;
      padding: 42px 0 72px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: clamp(25px, 5vw, 31px);
      letter-spacing: -.75px;
      line-height: 1.1;
    }

    .week { color: var(--muted); font-size: 13px; }

    .counter {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      background: rgba(255,255,255,.82);
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(36,38,50,.025);
    }

    .weekly, .section {
      border-radius: 16px;
      overflow: hidden;
    }

    .weekly {
      margin-bottom: 25px;
      padding: 17px 18px 13px;
      border: 1px solid #efdc9e;
      background: var(--gold-soft);
      box-shadow: 0 10px 26px rgba(166,111,0,.05);
    }

    .weekly-heading, .section-heading, .subheading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .weekly-title {
      color: var(--gold);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .1px;
    }

    .weekly-hint { color: #a88e53; font-size: 11px; }
    .priority-empty { padding: 16px 8px 12px; text-align: center; color: #a88e53; font-size: 12px; }

    .section {
      margin-bottom: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-heading { padding: 15px 17px; }
    .section-title { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 760; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

    .count {
      color: var(--accent, var(--muted));
      background: var(--soft, #f3f4f7);
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 700;
    }

    .assistant {
      margin: 0 12px 11px;
      overflow: hidden;
      border: 1px solid #ececf2;
      border-radius: 12px;
      background: #fff;
    }

    .subheading { min-height: 39px; padding: 9px 12px; background: #faf9fe; }
    .assistant-name { color: #3c3b47; font-size: 12.5px; font-weight: 680; }
    .subcount { color: #9296a1; font-size: 10px; }

    .task-list { min-height: 9px; }
    .standard-list { padding: 0 10px; }

    .task {
      display: flex;
      align-items: center;
      gap: 0;
      min-height: 43px;
      padding: 5px 8px;
      border-top: 1px solid #f0f0f3;
      background: transparent;
      transition: background .15s ease, opacity .15s ease, transform .15s ease;
    }

    .task:hover { background: #fbfbfd; }
    .task.dragging { opacity: .35; transform: scale(.992); }
    .task-list.drop-target { background: var(--purple-soft); outline: 1px dashed #b9b0e9; outline-offset: -3px; }

    .handle {
      padding: 6px 8px 6px 1px;
      color: #c2c5ce;
      cursor: grab;
      user-select: none;
      font-size: 13px;
      letter-spacing: -3px;
    }
    .handle:active { cursor: grabbing; }

    .check {
      width: 16px;
      height: 16px;
      margin: 0 10px 0 0;
      accent-color: var(--accent, var(--purple));
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      padding: 6px 4px 6px 0;
      outline: none;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.35;
    }

    .task.done .task-text { color: #a5a8b1; text-decoration: line-through; }

    .icon-button {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: #c2c5cd;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .icon-button:hover { background: #f2f2f6; }
    .star:hover, .star.active { color: #dfa821; }
    .delete:hover { color: var(--danger); }

    .tag {
      flex: 0 1 auto;
      max-width: 190px;
      margin: 0 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 999px;
      padding: 3px 7px;
      color: #826c2d;
      background: #ffefb8;
      font-size: 9.5px;
      font-weight: 650;
    }

    .add-row {
      display: flex;
      border-top: 1px solid #f0f0f3;
      background: #fcfcfd;
    }

    .standard-add { margin: 0 10px 10px; overflow: hidden; border: 1px solid #ececf0; border-radius: 9px; }

    .add-row input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 10px 12px;
      color: var(--ink);
      background: transparent;
      font-size: 12px;
    }

    .add-row input::placeholder { color: #a5a8b2; }

    .add-row button {
      border: 0;
      padding: 0 13px;
      color: var(--accent, var(--purple));
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
    }

    .add-row button:hover { background: var(--soft, var(--purple-soft)); }

    footer { margin-top: 21px; color: #9ca0aa; text-align: center; font-size: 10.5px; }

    @media (max-width: 580px) {
      .app { width: calc(100% - 18px); padding-top: 24px; }
      header { align-items: center; margin-bottom: 20px; }
      .counter { padding: 7px 10px; }
      .weekly-hint { display: none; }
      .tag { max-width: 105px; }
      .assistant { margin-inline: 8px; }
      .section-heading { padding-inline: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>My Work Checklist</h1>
        <div class="week" id="week"></div>
      </div>
      <div class="counter" id="counter">0 pending · 0 completed</div>
    </header>

    <section class="weekly" aria-labelledby="priorityTitle">
      <div class="weekly-heading">
        <div class="weekly-title" id="priorityTitle">★ This Week’s Priorities</div>
        <div class="weekly-hint">Star a task to add it here</div>
      </div>
      <div id="priorityList"></div>
      <div class="priority-empty" id="priorityEmpty">No priorities yet.</div>
    </section>

    <section class="section" style="--accent:#7468c9;--soft:#f3f0ff" aria-labelledby="assistantsTitle">
      <div class="section-heading">
        <div class="section-title" id="assistantsTitle"><span class="dot"></span>AI Assistants</div>
        <span class="count" id="assistantsCount">0 pending</span>
      </div>
      <div id="assistants"></div>
    </section>

    <main id="otherSections"></main>

    <footer>Drag tasks between lists · Click task text to edit · Changes save automatically in this browser</footer>
  </div>

  <script>
  (() => {
    'use strict';

    const ASSISTANTS = [
      'Solutions AI Assistant',
      'Experience Builder',
      'Instant Apps',
      'AI Components',
      'AI Powered Services'
    ];

    const CATEGORIES = [
      { id: 'agent', name: 'I18N Skill / Agent', color: '#856ac2', soft: '#f4effb' },
      { id: 'ago', name: 'AGO Automated Testing', color: '#3f9279', soft: '#edf8f4' },
      { id: 'cloner', name: 'Cloner', color: '#c66e88', soft: '#fff0f4' },
      { id: 'misc', name: 'Misc', color: '#527fae', soft: '#eef6fd' }
    ];

    const STORAGE_KEY = 'arushi-work-checklist-v3';
    let state = loadState();

    function uid() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
      return 'task-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    }

    function newTask(text) {
      return { id: uid(), text, done: false, priority: false };
    }

    function initialState() {
      const assistants = {};
      ASSISTANTS.forEach(name => { assistants[name] = []; });
      const categories = {};
      CATEGORIES.forEach(category => { categories[category.id] = []; });
      return { assistants, categories };
    }

    function normalize(candidate) {
      const clean = initialState();
      if (!candidate || typeof candidate !== 'object') return clean;
      ASSISTANTS.forEach(name => {
        if (Array.isArray(candidate.assistants?.[name])) clean.assistants[name] = candidate.assistants[name];
      });
      CATEGORIES.forEach(category => {
        if (Array.isArray(candidate.categories?.[category.id])) clean.categories[category.id] = candidate.categories[category.id];
      });
      return clean;
    }

    function loadState() {
      try { return normalize(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
      catch (_) { return initialState(); }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch (_) { /* The app still works when storage is unavailable. */ }
    }

    function getList(type, key) {
      return type === 'assistant' ? state.assistants[key] : state.categories[key];
    }

    function allTasks() {
      const result = [];
      ASSISTANTS.forEach(name => state.assistants[name].forEach(task => result.push({ task, label: name })));
      CATEGORIES.forEach(category => state.categories[category.id].forEach(task => result.push({ task, label: category.name })));
      return result;
    }

    function showWeek() {
      const now = new Date();
      const day = now.getDay();
      const monday = new Date(now);
      monday.setHours(12, 0, 0, 0);
      monday.setDate(now.getDate() + (day === 0 ? -6 : 1 - day));
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const format = value => value.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      document.getElementById('week').textContent = `Week of ${format(monday)} – ${format(sunday)}`;
    }

    function makeTaskElement(task, type, key, accent) {
      const row = document.createElement('div');
      row.className = 'task' + (task.done ? ' done' : '');
      row.draggable = true;
      row.dataset.taskId = task.id;
      row.style.setProperty('--accent', accent);
      row.innerHTML = `
        <span class="handle" aria-hidden="true">⋮⋮</span>
        <input class="check" type="checkbox" aria-label="Mark task complete" ${task.done ? 'checked' : ''}>
        <span class="task-text" contenteditable="true" role="textbox" aria-label="Task name"></span>
        <button class="icon-button star ${task.priority ? 'active' : ''}" type="button" title="${task.priority ? 'Remove from this week' : 'Add to this week'}" aria-label="${task.priority ? 'Remove from this week' : 'Add to this week'}">★</button>
        <button class="icon-button delete" type="button" title="Delete task" aria-label="Delete task">×</button>`;

      const text = row.querySelector('.task-text');
      text.textContent = task.text;

      row.querySelector('.check').addEventListener('change', event => {
        task.done = event.target.checked;
        render();
      });

      row.querySelector('.star').addEventListener('click', () => {
        task.priority = !task.priority;
        render();
      });

      row.querySelector('.delete').addEventListener('click', () => {
        const list = getList(type, key);
        const index = list.findIndex(item => item.id === task.id);
        if (index !== -1) list.splice(index, 1);
        render();
      });

      text.addEventListener('blur', () => {
        const value = text.textContent.replace(/\s+/g, ' ').trim();
        if (value) task.text = value;
        else text.textContent = task.text;
        saveState();
      });

      text.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          text.blur();
        }
      });

      row.addEventListener('dragstart', event => {
        if (event.target.closest('[contenteditable="true"], button, input')) {
          event.preventDefault();
          return;
        }
        row.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', JSON.stringify({ taskId: task.id, fromType: type, fromKey: key }));
      });

      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      return row;
    }

    function setupDropZone(zone, type, key) {
      zone.dataset.type = type;
      zone.dataset.key = key;
      zone.addEventListener('dragover', event => {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        zone.classList.add('drop-target');
      });
      zone.addEventListener('dragleave', event => {
        if (!zone.contains(event.relatedTarget)) zone.classList.remove('drop-target');
      });
      zone.addEventListener('drop', event => {
        event.preventDefault();
        zone.classList.remove('drop-target');
        let data;
        try { data = JSON.parse(event.dataTransfer.getData('text/plain')); }
        catch (_) { return; }
        const source = getList(data.fromType, data.fromKey);
        const sourceIndex = source.findIndex(item => item.id === data.taskId);
        if (sourceIndex === -1) return;
        const [task] = source.splice(sourceIndex, 1);
        const destination = getList(type, key);
        destination.push(task);
        render();
      });
    }

    function bindAdd(row, type, key) {
      const input = row.querySelector('input');
      const button = row.querySelector('button');
      const add = () => {
        const value = input.value.replace(/\s+/g, ' ').trim();
        if (!value) return;
        getList(type, key).push(newTask(value));
        render();
        requestAnimationFrame(() => {
          const target = document.querySelector(`[data-add-type="${CSS.escape(type)}"][data-add-key="${CSS.escape(key)}"] input`);
          target?.focus();
        });
      };
      button.addEventListener('click', add);
      input.addEventListener('keydown', event => { if (event.key === 'Enter') add(); });
    }

    function renderAssistants() {
      const root = document.getElementById('assistants');
      root.textContent = '';
      let pending = 0;

      ASSISTANTS.forEach(name => {
        const list = state.assistants[name];
        const open = list.filter(task => !task.done).length;
        pending += open;
        const box = document.createElement('section');
        box.className = 'assistant';
        box.style.setProperty('--accent', '#7468c9');
        box.style.setProperty('--soft', '#f3f0ff');
        box.innerHTML = `
          <div class="subheading">
            <span class="assistant-name"></span>
            <span class="subcount">${open} pending</span>
          </div>
          <div class="task-list"></div>
          <div class="add-row" data-add-type="assistant">
            <input type="text" maxlength="240" aria-label="Add task" placeholder="+ Add task">
            <button type="button">Add</button>
          </div>`;
        box.querySelector('.assistant-name').textContent = name;
        const taskList = box.querySelector('.task-list');
        list.forEach(task => taskList.appendChild(makeTaskElement(task, 'assistant', name, '#7468c9')));
        setupDropZone(taskList, 'assistant', name);
        const addRow = box.querySelector('.add-row');
        addRow.dataset.addKey = name;
        bindAdd(addRow, 'assistant', name);
        root.appendChild(box);
      });

      document.getElementById('assistantsCount').textContent = `${pending} pending`;
    }

    function renderCategories() {
      const root = document.getElementById('otherSections');
      root.textContent = '';

      CATEGORIES.forEach(category => {
        const list = state.categories[category.id];
        const pending = list.filter(task => !task.done).length;
        const section = document.createElement('section');
        section.className = 'section';
        section.style.setProperty('--accent', category.color);
        section.style.setProperty('--soft', category.soft);
        section.innerHTML = `
          <div class="section-heading">
            <div class="section-title"><span class="dot"></span><span class="category-label"></span></div>
            <span class="count">${pending} pending</span>
          </div>
          <div class="task-list standard-list"></div>
          <div class="add-row standard-add" data-add-type="category" data-add-key="${category.id}">
            <input type="text" maxlength="240" aria-label="Add task" placeholder="+ Add task">
            <button type="button">Add</button>
          </div>`;
        section.querySelector('.category-label').textContent = category.name;
        const taskList = section.querySelector('.task-list');
        list.forEach(task => taskList.appendChild(makeTaskElement(task, 'category', category.id, category.color)));
        setupDropZone(taskList, 'category', category.id);
        bindAdd(section.querySelector('.add-row'), 'category', category.id);
        root.appendChild(section);
      });
    }

    function renderPriorities() {
      const root = document.getElementById('priorityList');
      root.textContent = '';
      const priorities = allTasks().filter(item => item.task.priority && !item.task.done);
      document.getElementById('priorityEmpty').hidden = priorities.length > 0;

      priorities.forEach(({ task, label }) => {
        const row = document.createElement('div');
        row.className = 'task';
        row.innerHTML = `
          <input class="check" type="checkbox" aria-label="Mark priority complete">
          <span class="task-text"></span>
          <span class="tag"></span>
          <button class="icon-button star active" type="button" title="Remove from this week" aria-label="Remove from this week">★</button>`;
        row.querySelector('.task-text').textContent = task.text;
        row.querySelector('.tag').textContent = label;
        row.querySelector('.check').addEventListener('change', () => { task.done = true; render(); });
        row.querySelector('.star').addEventListener('click', () => { task.priority = false; render(); });
        root.appendChild(row);
      });
    }

    function renderCounter() {
      const tasks = allTasks().map(item => item.task);
      const done = tasks.filter(task => task.done).length;
      document.getElementById('counter').textContent = `${tasks.length - done} pending · ${done} completed`;
    }

    function render() {
      renderAssistants();
      renderCategories();
      renderPriorities();
      renderCounter();
      saveState();
    }

    showWeek();
    render();
  })();
  </script>
</body>
</html>
